<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff4faf"><link rel="manifest" href="manifest.json"><title>Vivi Life XP</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3a1730,#08080b 35%);color:#faf7fb;font-family:-apple-system,sans-serif}.app{max-width:650px;margin:auto;padding:24px 17px 90px}.brand{font-weight:900;letter-spacing:.14em}.card{background:#141319;border:1px solid #2b2730;border-radius:20px;padding:18px;margin:12px 0}.hero{background:linear-gradient(145deg,#281522,#111015)}h1{font-size:38px;margin:4px 0}.small{color:#99939e;font-size:12px}.pink{color:#ff91cf}.bar{height:8px;background:#2a272e;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,#ff4faf,#ff91cf)}.head{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 8px;font-weight:900}.btn,.icon{border:0;border-radius:10px;padding:9px 12px;font-weight:900}.btn{background:#ff4faf;color:#190914}.icon,.outline{background:#17161c;color:#eee;border:1px solid #2b2730}.quest,.reward{display:flex;align-items:center;gap:9px;padding:13px 0;border-bottom:1px solid #2b2730}.quest:last-child,.reward:last-child{border:0}.check{width:24px;height:24px;border:1px solid #4a4550;border-radius:7px;display:grid;place-items:center}.done .check{background:#ff4faf;color:#180a12}.done .name{text-decoration:line-through;color:#777}.name,.info{flex:1;font-weight:750}.xp{font-size:12px;color:#ff91cf;font-weight:800}.actions{display:flex;gap:4px}.goal{height:7px;background:#2a272e;border-radius:20px;overflow:hidden;margin-top:7px}.goal i{display:block;height:100%;background:#ff4faf}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0b0b0fee;border-top:1px solid #2b2730;padding:9px}.nav button{flex:1;max-width:150px;background:none;border:0;color:#888;padding:10px;font-weight:800}.nav .on{color:white;background:#24151f;border-radius:10px}.view{display:none}.view.on{display:block}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:min(650px,100%);margin:auto;background:#16151b;padding:20px;border-radius:24px 24px 0 0}.sheet input{width:100%;padding:13px;margin:7px 0 12px;background:#0d0d12;color:white;border:1px solid #2b2730;border-radius:10px}.row{display:flex;gap:8px}.row>*{flex:1}.empty{color:#99939e}.available{font-size:34px;font-weight:950}</style>
<div class="app"><div class="brand">VIVI LIFE XP</div>
<section id="home" class="view on"><div class="card hero"><div class="small">YOUR PROGRESS</div><h1 id="level">LEVEL 1</h1><div class="pink"><span id="total">0</span> total XP earned</div><div class="bar"><div id="levelbar" class="fill"></div></div></div>
<div class="head"><span>Today's Quests</span><span><button class="btn outline" onclick="resetToday()">Reset</button> <button class="btn" onclick="qform('today')">＋</button></span></div><div class="card" id="today"></div>
<div class="head"><span>General Quests</span><button class="btn" onclick="qform('general')">＋ Add</button></div><div class="card" id="general"></div>
<div class="head">Available XP</div><div class="card"><div class="small">XP YOU CAN SPEND</div><div class="available"><span id="avail">0</span> XP</div></div></section>
<section id="rewards" class="view"><div class="head"><span>Rewards</span><button class="btn" onclick="rform()">＋ Add</button></div><div class="card small">Contribute your available XP toward rewards. Spending XP never lowers your level.</div><div class="card" id="rewardsList"></div></section>
<section id="stats" class="view"><div class="head">Progress</div><div class="card"><b>Total XP:</b> <span id="stotal"></span><br><br><b>Available XP:</b> <span id="sav"></span><br><br><b>Quest completions:</b> <span id="comp"></span></div></section></div>
<div class="nav"><button class="on" onclick="view('home',this)">Home</button><button onclick="view('rewards',this)">Rewards</button><button onclick="view('stats',this)">Stats</button></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const K="vivi-xp-v5";let d=JSON.parse(localStorage.getItem(K)||"null")||{total:0,avail:0,comp:0,today:[{id:1,n:"Physical therapy",x:25,d:0},{id:2,n:"Workout",x:20,d:0},{id:3,n:"Wear brace for 15+ hours",x:25,d:0},{id:4,n:"Clean room",x:15,d:0},{id:5,n:"Work for Dad for 2 hours",x:25,d:0},{id:6,n:"Study",x:20,d:0}],general:[{id:101,n:"Work on business / marketing",x:50,d:0},{id:102,n:"Read",x:30,d:0}],rewards:[]};const S=()=>localStorage.setItem(K,JSON.stringify(d)),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){level.textContent="LEVEL "+(Math.floor(d.total/200)+1);total.textContent=d.total;levelbar.style.width=(d.total%200)/2+"%";avail.textContent=d.avail;stotal.textContent=d.total;sav.textContent=d.avail;comp.textContent=d.comp;today.innerHTML=ql(d.today,"today");general.innerHTML=ql(d.general,"general");rewardsList.innerHTML=d.rewards.length?d.rewards.map(rhtml).join(""):'<div class="empty">No rewards yet.</div>'}
function ql(a,t){return a.map(q=>`<div class="quest ${q.d?"done":""}"><div class="check" onclick="toggle('${t}',${q.id})">${q.d?"✓":""}</div><div class="name" onclick="toggle('${t}',${q.id})">${E(q.n)}</div><div class="xp">+${q.x} XP</div><div class="actions"><button class="icon" onclick="qform('${t}',${q.id})">✎</button><button class="icon" onclick="delq('${t}',${q.id})">×</button></div></div>`).join("")||'<div class="empty">No quests.</div>'}
function rhtml(r){let p=Math.min(100,r.s/r.c*100),ready=r.s>=r.c;return `<div class="reward"><div class="info">${E(r.n)}${ready?" · UNLOCKED":""}<div class="small">${r.s} / ${r.c} XP</div><div class="goal"><i style="width:${p}%"></i></div></div><button class="icon" onclick="rform(${r.id})">✎</button><button class="icon" onclick="delr(${r.id})">×</button><button class="btn" onclick="${ready?`redeem(${r.id})`:`contrib(${r.id})`}">${ready?"Use":"＋ XP"}</button></div>`}
function toggle(t,id){let a=d[t],q=a.find(v=>v.id==id);if(q.d)q.d=0;else{q.d=1;d.total+=q.x;d.avail+=q.x;d.comp++}S();render()}
function qform(t,id=0){let q=id?d[t].find(v=>v.id==id):null;sheet.innerHTML=`<h2>${q?"Edit":"Add"} Quest</h2><input id="qn" placeholder="Quest name" value="${q?E(q.n):""}"><input id="qx" type="number" min="0" value="${q?q.x:25}"><div class="row"><button class="btn" onclick="saveq('${t}',${id})">Save</button><button class="btn outline" onclick="closeM()">Cancel</button></div>`;modal.classList.add("on")}
function saveq(t,id){if(!qn.value.trim())return;let a=d[t],q={id:id||Date.now(),n:qn.value.trim(),x:+qx.value||0,d:0};if(id){let o=a.find(v=>v.id==id);q.d=o.d;a[a.indexOf(o)]=q}else a.push(q);S();closeM();render()}
function delq(t,id){if(confirm("Delete this quest?")){d[t]=d[t].filter(v=>v.id!=id);S();render()}}function resetToday(){if(confirm("Reset Today's Quests? Earned XP stays.")){d.today.forEach(q=>q.d=0);S();render()}}
function rform(id=0){let r=id?d.rewards.find(v=>v.id==id):null;sheet.innerHTML=`<h2>${r?"Edit":"Add"} Reward</h2><input id="rn" placeholder="Reward name" value="${r?E(r.n):""}"><input id="rc" type="number" min="1" value="${r?r.c:500}"><div class="row"><button class="btn" onclick="saver(${id})">Save</button><button class="btn outline" onclick="closeM()">Cancel</button></div>`;modal.classList.add("on")}
function saver(id){let n=rn.value.trim(),c=Math.floor(+rc.value);if(!n||c<1)return;if(id){let r=d.rewards.find(v=>v.id==id);r.n=n;r.c=c;r.s=Math.min(r.s,c)}else d.rewards.push({id:Date.now(),n:n,c:c,s:0});S();closeM();render()}
function contrib(id){let r=d.rewards.find(v=>v.id==id),m=Math.min(d.avail,r.c-r.s);if(m<1){alert("Earn more XP first.");return}sheet.innerHTML=`<h2>Contribute XP</h2><div class="small">Available: ${d.avail} XP</div><input id="amt" type="number" min="1" max="${m}" value="${m}"><div class="row"><button class="btn" onclick="doc(${id},${m})">Contribute</button><button class="btn outline" onclick="closeM()">Cancel</button></div>`;modal.classList.add("on")}
function doc(id,m){let n=Math.floor(+amt.value);if(n<1||n>m)return;let r=d.rewards.find(v=>v.id==id);d.avail-=n;r.s+=n;S();closeM();render()}function redeem(id){let r=d.rewards.find(v=>v.id==id);if(r.s>=r.c){r.s=0;S();render()}}function delr(id){if(confirm("Delete reward?")){d.rewards=d.rewards.filter(v=>v.id!=id);S();render()}}
function closeM(){modal.classList.remove("on")}function view(id,b){document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll(".nav button").forEach(v=>v.classList.remove("on"));b.classList.add("on")}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
